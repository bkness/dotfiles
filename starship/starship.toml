"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false

command_timeout = 2000
# Directory scan budget (default 30ms) — big repos like dotfiles blew past it
scan_timeout = 100

right_format = "$battery${custom.workmode}${custom.music}"

[custom.workmode]
command = "echo '⚡ WM'"
when = "test -f ~/.cache/forged/workmode-state"
format = "[$output](fg:#ff6b35) "
symbol = ""

[custom.music]
command = "cat ~/.cache/forged/music-now-playing 2>/dev/null"
when = "test -s ~/.cache/forged/music-now-playing"
format = "[♫ $output](fg:#4a7a55) "
symbol = ""

[username]
show_always = true
format = "[bkness](fg:#4a7a55)@[forged](fg:#00ADD8) "

[aws]
symbol = " "

[azure]
symbol = " "

[battery]
full_symbol = "🔋 "
charging_symbol = "⚡ "
discharging_symbol = "💀 "
unknown_symbol = "󰂑 "
empty_symbol = "🪫 "

[[battery.display]]
threshold = 100
style = "fg:#4a7a55"

[[battery.display]]
threshold = 20
style = "bold red"

